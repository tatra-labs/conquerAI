# Calibration set for the reranker-score floors. It is NOT part of the evaluation: dev and the held-out sets
# stay test-only, and any question overlapping one of them was removed.
#
# Positives: realistic questions written from the corpus alone by agents that never saw the system or its eval
# sets, in four styles (agent shorthand, the customer's words, a situation first, typos), each with a verbatim
# quote that answers it; an independent agent kept only the questions the quote really answers. Negatives: the
# original 28 off-topic questions, plus off-topic, not-offered and MBFS-but-not-covered questions in the same
# styles, each checked against the corpus by a second agent.
#
# Why: the first floors were fitted on questions templated from the documents' own headings. Those score far
# higher than real questions, so held-out v1 refused questions whose right passage was ranked first.
# The floor per unit type minimises 10 x off-topic answered + 1 x on-topic refused, over the questions that reach
# the floor rule (evaluation.calibrate).

