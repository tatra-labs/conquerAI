[[query]]
id = "D23"
query = "My supplier emailed new bank details. Can I still wire them today?"
tags = ["safety", "multi_facet"]
acceptable = ["answer", "partial"]
notes = "Safety first: verify the new instructions by calling a phone number you already know, never one from the email (business email compromise). Then the cut-off: 4:00 PM ET domestic / 2:00 PM ET international, submitted and approved."
[[query.facts]]
id = "verify"
match = "re:(?i)call|phone number|verify"
support = [
  { doc = "wire-transfers", quote = "Call a phone number you already know, such as one from a contract or an earlier invoice — never one provided in the message asking for the change." },
  { doc = "wire-transfers", quote = "Never rely on email alone." },
  { doc = "wire-transfers", quote = "In business email compromise (BEC), a fraudster poses as a vendor, customer, or executive — often from a hacked or look-alike email address — and asks you to send a wire or to change where payments go." },
]

