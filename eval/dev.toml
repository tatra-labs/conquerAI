[[query]]
id = "D05"
query = "What is the chargeback fee?"
tags = ["table_lookup", "superseded", "draft"]
acceptable = ["answer"]
notes = "$25.00 per chargeback, non-refundable. Superseded schedule says $15; the never-approved draft says $35."
[[query.facts]]
