# MBFS dev set. Each item states the acceptable decisions (preferred first), the facts a good answer must
# contain (typed matchers, checked on the asserted answer text only, never on notes), where each fact is
# supported (verbatim quotes, or a fee-schedule row code + plan column), forbidden values (checked on the
# asserted text only), and - where I expected a failure before the first full run - why.
#
# Matchers: money:45 | percent:2.25 | time:4pm | days:10 | text:<words> | re:<regex>
# Assumed user: a contact-center agent (agent-assist). As-of date: the corpus snapshot, 2026-10-19.

[[query]]
id = "D01"
query = "How long do I have to respond to a chargeback?"
tags = ["single_fact", "distractor"]
acceptable = ["answer"]
notes = "10 calendar days from the chargeback notification, in the Merchant Portal; no response = accepted. The same section says retrieval requests have 7 calendar days - a lexical distractor."
predicted_failure = "Every reranker tried (MiniLM-L6, jina-turbo, bge-reranker-v2-m3) scores the retrieval-request sentence ('within 7 calendar days ... before it becomes a chargeback') above the 10-day rule."
[[query.facts]]
id = "ten_days"
match = "days:10"
support = [
  { doc = "chargebacks-and-disputes", quote = "Accept or respond within 10 calendar days of notification" },
  { doc = "chargebacks-and-disputes", quote = "Important: The 10 calendar days are counted from the notification date, including weekends and holidays." },
]

[[query]]
id = "D02"
query = "What's the fee for an outgoing international wire on the Plus plan?"
tags = ["table_lookup", "stale_faq", "superseded"]
acceptable = ["answer"]
notes = "$45.00 per wire (WIR-03, Bridge Plus). The stale FAQ and the superseded 2025 schedule both say $40 on Plus."
[[query.facts]]
id = "fee"
match = "money:45"
support = [{ doc = "fee-schedule-2026-07", row = "WIR-03", column = "Bridge Plus" }]
[[query.forbidden]]
match = "money:40"
why = "stale FAQ / superseded schedule value"

