  { doc = "fee-schedule-2026-07", row = "MER-05" },
  { doc = "chargebacks-and-disputes", quote = "Chargeback fee: $25.00 per chargeback, as listed in the Business Fee & Rate Schedule (code MER-05; it appears on your statement as CB FEE)." },
