  { doc = "help-tax-forms", quote = "You'll receive a Form 1099-K if you received card payments through MerchantBridge during the year." },
]

[[query]]
id = "D21"
query = "I sell hemp-derived CBD products. Can I open an account with you?"
tags = ["domain", "fine_grained"]
acceptable = ["answer", "partial"]
notes = "Restricted, not prohibited: possible after enhanced due diligence; the agent must not promise approval and must route to Onboarding. A flat 'no' copied from the cannabis line is wrong."
[[query.facts]]
id = "restricted"
match = "re:(?i)enhanced (review|due diligence)|restricted business"
support = [
  { doc = "account-opening-kyc", quote = "Note: Sellers of hemp-derived CBD products are not prohibited." },
  { doc = "account-opening-kyc", quote = "They are a restricted business type and need enhanced review (see below)." },
  { doc = "account-opening-kyc", quote = "MerchantBridge support agents must not promise approval for a restricted business type and must route the applicant to the Onboarding team, which carries out the enhanced review and makes the decision." },
  # Added after the code review made support mandatory: the enhanced-due-diligence list states the fact too.
  { doc = "account-opening-kyc", quote = "The following businesses may be approved only after enhanced due diligence:" },
  { doc = "account-opening-kyc", quote = "Sellers of hemp-derived CBD products" },
]

[[query]]
id = "D22"
query = "Is my $400,000 in Reserve Savings FDIC insured?"
tags = ["domain", "regulated"]
acceptable = ["answer", "partial"]
notes = "Deposits are held at Lanternstone Bank, N.A., Member FDIC; coverage is up to $250,000 per depositor, per bank, per ownership category; balances above that are not insured; MerchantBridge is not a bank."
[[query.facts]]
id = "limit"
match = "money:250000"
support = [
  { doc = "products-overview", quote = "FDIC insurance covers up to $250,000 per depositor, per insured bank, for each account ownership category." },
  { doc = "products-overview", quote = "Balances above the $250,000 limit are not insured." },
  { doc = "products-overview", quote = "Checking and Bridge Reserve Savings balances held by the same business at Lanternstone Bank are added together toward the $250,000 limit." },
]
