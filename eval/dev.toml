[[query]]
id = "D11"
query = "How long do I have to report an unauthorized debit on my business account?"
tags = ["ambiguous", "cross_doc", "high_harm"]
acceptable = ["answer", "clarify"]
notes = "For an ACH debit on a business account: notify within 1 business day (R29 2-banking-day window). Card disputes have 60 days - answering only '60 days' for an ACH debit costs the customer money."
[[query.facts]]
id = "one_day"
match = "re:(?i)\\b1 business day"
support = [
  { doc = "ach-payments", quote = "If an ACH debit you didn't authorize posts to your MerchantBridge account, notify us within 1 business day of the posting by calling Business Support at 1-800-555-0142." },
  { doc = "ach-payments", quote = "That is why a consumer customer can return your debit long after you've been paid, while you need to report an unauthorized debit on your own business account within 1 business day." },
]

