[[query]]
id = "V10"
query = "the app keeps rejecting my check, it says something about the endorsement, what am I supposed to write on the back?"
tags = ["mobile-deposit", "endorsement", "check-rejected"]
acceptable = ["answer"]
notes = "Before photographing, endorse the back with the customer's signature and the words \"For mobile deposit only at MerchantBridge\", then retake the photos and resubmit. If check retention comes up, the Funds Availability Policy says keep the check 14 days; the help article's 30 days conflicts with it."
[[query.facts]]
id = "endorsement_words"
match = "text:For mobile deposit only at MerchantBridge"
support = [
  { doc = "funds-availability", quote = "Before you photograph the check, endorse the back with:" },
  { doc = "funds-availability", quote = "The words \"For mobile deposit only at MerchantBridge\"." },
  { doc = "help-mobile-deposit", quote = "On the back, sign your name and write \"For mobile deposit only at MerchantBridge\"." },
  { doc = "help-mobile-deposit", quote = "The endorsement is missing or doesn't include \"For mobile deposit only at MerchantBridge\"." },
]
[[query.facts]]
id = "signature"
match = "re:(?i)signature|\\bsigned\\b|\\bsign (your|the|their|it|her|his)\\b"
support = [
  { doc = "funds-availability", quote = "Before you photograph the check, endorse the back with:" },
  { doc = "funds-availability", quote = "Your signature." },
  { doc = "help-mobile-deposit", quote = "On the back, sign your name and write \"For mobile deposit only at MerchantBridge\"." },
]
[[query.forbidden]]
match = "re:(?i)for mobile deposit only(?!\\s+at\\s+merchantbridge)"
why = "the endorsement must include the full words \"For mobile deposit only at MerchantBridge\"; a check whose endorsement leaves out \"at MerchantBridge\" can be rejected"
[[query.forbidden]]
match = "days:30"
why = "help-article retention period that conflicts with the Funds Availability Policy, which says keep the check 14 days"

