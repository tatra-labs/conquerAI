[[query]]
id = "V05"
query = "how to add a view-only user for cust's bookkeeper, no acess to move money"
tags = ["users", "permissions", "security", "internal-procedure"]
acceptable = ["answer", "partial"]
notes = "An owner or admin adds the bookkeeper as a user in Settings in the MBFS app (the new user sets up their own password and two-step verification); agents can't add users over the phone, even for a verified owner. A view-only user can see balances, statements and transaction history but can't make changes, and the bookkeeper can't be verified or told about the account until added; the KB doesn't spell out the role-picker clicks."
[[query.facts]]
id = "owner_or_admin_adds"
match = "re:(?i)\\bowners?\\s*(or|/)\\s*(an\\s+)?admins?\\b"
support = [
  { doc = "help-online-banking-security", quote = "An owner or admin can add users in Settings, and each new user sets up their own password and two-step verification." },
  { doc = "help-online-banking-security", quote = "For your protection, changes to users, your payout bank account, or your contact email or phone number must be approved in the MerchantBridge app by an owner or admin." },
  { doc = "caller-verification-sop", quote = "An owner or admin can add them as a user in the app; after that, verify them like any other user." },
  { doc = "caller-verification-sop", quote = "Role: Owner or admin; What you can discuss or do for them: Full access to the account, including adding users and changing the payout destination" },
  { doc = "caller-verification-sop", quote = "These changes always require approval in the app by an owner or admin, even when the caller is verified:" },
]
[[query.facts]]
id = "in_app_not_by_phone"
match = "re:(?i)over the phone|\\b(in|through|via|from|using) the (mbfs |merchantbridge )?app\\b"
support = [
  { doc = "help-online-banking-security", quote = "For your protection, changes to users, your payout bank account, or your contact email or phone number must be approved in the MerchantBridge app by an owner or admin. Our team can't make these changes for you over the phone." },
  { doc = "caller-verification-sop", quote = "Changes to the payout bank account, contact email or phone, or users must be approved in the app, never over the phone" },
  { doc = "caller-verification-sop", quote = "Changes to users, such as adding or removing a user" },
  { doc = "caller-verification-sop", quote = "Never complete these changes over the phone, even for a verified owner or admin." },
  { doc = "caller-verification-sop", quote = "An owner or admin can add them as a user in the app; after that, verify them like any other user." },
]
[[query.facts]]
id = "view_only_scope"
match = "re:(?i)(cannot|can't|can’t|can not|unable to|not able to|won't be able to|won’t be able to) (make|move|send|initiate|transfer)|balances|statements|transaction history"
support = [
  { doc = "caller-verification-sop", quote = "Role: View-only user (such as a bookkeeper or accountant); What you can discuss or do for them: You can share account balances, statements and transaction history after verification; Limits: Cannot make changes" },
  { doc = "account-closure", quote = "Employee cardholders and view-only users (such as a bookkeeper) cannot request a closure." },
]

