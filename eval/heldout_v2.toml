[[query]]
id = "V04"
query = "if I send the terminal back do I get my money back?"
tags = ["terminals", "returns", "fees", "ambiguous", "partial"]
acceptable = ["partial", "clarify"]
notes = "It depends on rented vs bought: a rented terminal goes back within 30 days of cancellation or closure with the prepaid label (else a $199.00 Mini / $599.00 Pro non-return fee), and if that fee already posted only Merchant Operations can reverse it, and only if the terminal arrives within 15 days of the fee. A bought terminal doesn't need to go back (yours to keep, 1-year warranty) and the KB has no refund-on-return policy for purchases, so escalate rather than say refunds aren't offered."
[[query.facts]]
id = "nonreturn_fee_reversal_15_days"
match = "days:15"
support = [
  { doc = "agent-handling-guidelines", quote = "Merchant Operations reverses it only if the terminal is received within 15 days of the fee." },
]
[[query.facts]]
id = "rental_return_30_days"
match = "days:30"
support = [
  { doc = "help-terminals", quote = "If you cancel a terminal rental or close your MerchantBridge account, return each rented terminal within 30 days of the cancellation or account closure, using the prepaid return label we provide." },
  { doc = "help-terminals", quote = "Non-return fee: If a rented terminal is not returned within 30 days of cancellation or account closure, a non-return fee is charged for each terminal: $199.00 for a BridgeTerminal Mini or $599.00 for a BridgeTerminal Pro." },
  { doc = "account-closure", quote = "Terminal: BridgeTerminal Mini; If you rent it: Return within 30 days of closure using the prepaid return label, or a $199.00 non-return fee applies; If you bought it: No return needed" },
  { doc = "account-closure", quote = "Terminal: BridgeTerminal Pro; If you rent it: Return within 30 days of closure using the prepaid return label, or a $599.00 non-return fee applies; If you bought it: No return needed" },
  { doc = "account-closure", quote = "The same 30-day window applies if you cancel a terminal rental but keep your account open." },
  { doc = "fee-schedule-2026-07", row = "HW-05" },
  { doc = "fee-schedule-2026-07", row = "HW-06" },
]
[[query.facts]]
id = "purchased_yours_to_keep"
match = "re:(?i)yours to keep|only rented terminals|no return (is )?needed|no need to return|(don't|don’t|do not|doesn't|doesn’t|does not|won't|won’t|will not) (need|have) to (be )?return"
support = [
  { doc = "help-terminals", quote = "Only rented terminals need to be returned. A terminal you bought is yours to keep, even if you close your account." },
  { doc = "account-closure", quote = "Purchased terminals are yours to keep, but they cannot accept card payments through MerchantBridge after your account is closed." },
  { doc = "account-closure", quote = "Terminal: BridgeTerminal Mini; If you rent it: Return within 30 days of closure using the prepaid return label, or a $199.00 non-return fee applies; If you bought it: No return needed" },
  { doc = "account-closure", quote = "Terminal: BridgeTerminal Pro; If you rent it: Return within 30 days of closure using the prepaid return label, or a $599.00 non-return fee applies; If you bought it: No return needed" },
]
