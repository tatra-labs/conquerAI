# MBFS held-out set v2, V01-V20. Same schema as dev.toml.
#
# Built after held-out v1's single blind run, under the same protocol: two writers saw only a short product
# description and wrote ten questions each, scenario first; two labelers saw only those questions and the canonical
# corpus text and labeled them blind, with no access to the code or to any system output. Labels are as returned;
# the labelers' doubts are in eval/heldout_v2_notes.md. results.json records this file's SHA-256 ("frozen").
# Several questions share a scenario with a v1 question (the writers saw the same brief); the README reports v2
# both overall and split by that overlap.

[[query]]
id = "V01"
query = "do I need to be charging sales tax on my online orders that ship out of state?"
tags = ["tax", "out-of-scope", "refuse"]
acceptable = ["refuse"]
notes = "The KB says nothing about sales-tax collection or out-of-state shipping rules. A good response declines rather than guessing either way, says MBFS cannot provide tax advice, and points the customer to a qualified tax professional (help-tax-forms)."

[[query]]
id = "V02"
query = "my payout this morning is like $300 short of what I ran on Saturday, what did you guys take out?"
tags = ["payouts", "weekend-timing", "deductions", "account-specific", "partial"]
acceptable = ["partial", "answer"]
notes = "What was actually deducted needs the account (verify the caller, then check the payout), but the KB explains the mechanics: Saturday batches are treated as closing Monday and pay out Tuesday (Plus/Premier) or Wednesday (Essentials), so a Monday-morning payout (2026-10-19 is a Monday) is Friday's or Thursday's batch, and refunds and chargebacks (disputed amount plus the $25.00 fee) come out of the next payout. If a hold or reserve shows, use the Risk Ops hold statement instead of speculating."
[[query.facts]]
id = "weekend_batch"
match = "re:(?i)(saturday|weekend)[^.]*\\b(monday|tuesday|wednesday|thursday|friday)\\b|\\b(monday|tuesday|wednesday|thursday|friday)\\b[^.]*(saturday|weekend)"
support = [
  { doc = "payouts-and-settlement", quote = "Batches that close on Saturday or Sunday are treated as closing on Monday." },
  { doc = "payouts-and-settlement", quote = "Example: On Bridge Essentials, batches that close on Saturday and Sunday are treated as closing on Monday, so they arrive on Wednesday, 2 business days after Monday. On Bridge Plus or Bridge Premier, the same weekend batches arrive on Tuesday." },
  { doc = "payouts-and-settlement", quote = "Batch closes (8:00 PM ET): Saturday or Sunday (treated as Monday); Bridge Essentials payout arrives: Wednesday; Bridge Plus and Bridge Premier payout arrives: Tuesday" },
  { doc = "payouts-and-settlement", quote = "Batch closes (8:00 PM ET): Thursday; Bridge Essentials payout arrives: Monday; Bridge Plus and Bridge Premier payout arrives: Friday" },
  { doc = "payouts-and-settlement", quote = "Batch closes (8:00 PM ET): Friday; Bridge Essentials payout arrives: Tuesday; Bridge Plus and Bridge Premier payout arrives: Monday" },
  { doc = "help-getting-paid", quote = "Batches that close on Saturday or Sunday are treated as closing on Monday, so payouts for weekend sales arrive on Wednesday on Bridge Essentials and on Tuesday on Bridge Plus and Bridge Premier." },
  { doc = "help-getting-paid", quote = "Plan: Bridge Essentials; Standard payout timing: 2 business days after the batch closes; Batch closes Friday: Arrives Tuesday; Batch closes Saturday or Sunday: Arrives Wednesday" },
  { doc = "help-getting-paid", quote = "Plan: Bridge Plus; Standard payout timing: Next business day after the batch closes; Batch closes Friday: Arrives Monday; Batch closes Saturday or Sunday: Arrives Tuesday" },
  { doc = "help-getting-paid", quote = "Plan: Bridge Premier; Standard payout timing: Next business day after the batch closes; Batch closes Friday: Arrives Monday; Batch closes Saturday or Sunday: Arrives Tuesday" },
  { doc = "agent-handling-guidelines", quote = "Payouts are not initiated on weekends or Federal Reserve holidays, and batches that close on Saturday or Sunday are treated as closing on Monday." },
]
[[query.facts]]
id = "refunds_deducted"
match = "text:refund"
support = [
  { doc = "payouts-and-settlement", quote = "Refunds you issue are deducted from your next payout." },
  { doc = "help-getting-paid", quote = "Refunds you issue are deducted from your next payout or your checking balance." },
  { doc = "help-refunds", quote = "Refunds are deducted from your next payout. If your next payout isn't enough to cover a refund, the remaining amount is deducted from your MerchantBridge business checking balance." },
  { doc = "help-refunds", quote = "Refunds are deducted from your next payout first." },
]
[[query.facts]]
id = "chargebacks_deducted"
match = "text:chargeback"
support = [
  { doc = "payouts-and-settlement", quote = "When MBFS receives a chargeback, the disputed amount plus the chargeback fee is also deducted from your next payout." },
  { doc = "chargebacks-and-disputes", quote = "Debit the disputed amount plus the chargeback fee from your next payout." },
  { doc = "chargebacks-and-disputes", quote = "Stage: Chargeback; What happens: The issuer reverses the sale, and we debit the disputed amount plus the chargeback fee." },
  { doc = "chargebacks-and-disputes", quote = "The disputed amount has already been debited from your payout or checking account" },
  { doc = "help-getting-paid", quote = "When we receive a chargeback, we debit the disputed amount plus the chargeback fee from your next payout, or from your checking account if your payouts aren't enough to cover it." },
]
[[query.forbidden]]
match = "money:15"
why = "superseded January 2025 chargeback fee; the current MER-05 chargeback fee is $25.00"

