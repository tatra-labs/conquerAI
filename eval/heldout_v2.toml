[[query]]
id = "V13"
query = "PCI non-compliance fee hit again this month, if they finish the SAQ today can we refund it?"
tags = ["pci", "fee-reversal", "agent-procedure", "synonym", "internal"]
acceptable = ["answer"]
notes = "No. The PCI non-validation fee ($19.95/month) is never reversible by agents. Merchant Risk reverses it only if the SAQ was completed before the fee posted, so finishing the SAQ today does not get this month's fee reversed. A good answer adds that completing the SAQ stops further charges, because the fee is charged each month until compliance is validated."
[[query.facts]]
id = "agents_cannot_reverse"
match = "re:(?i)\\b(?:never|not|cannot|unable|\\w+n[^\\w\\s]t)\\b[^.]{0,60}?\\b(?:revers|refund|credit|waiv)"
support = [
  { doc = "agent-handling-guidelines", quote = "Fee: PCI non-validation fee; Reversal rule: Never reversible by agents." },
  { doc = "agent-handling-guidelines", quote = "Agents can never reverse these fees, even with supervisor approval." },
  { doc = "agent-handling-guidelines", quote = "Merchant Risk reverses it only if the SAQ was completed before the fee posted." },
]
[[query.facts]]
id = "merchant_risk_rule"
match = "text:Merchant Risk"
support = [
  { doc = "agent-handling-guidelines", quote = "Merchant Risk reverses it only if the SAQ was completed before the fee posted." },
  { doc = "agent-handling-guidelines", quote = "PCI non-validation fee reversal requests go to Merchant Risk, a different team from Risk Operations." },
]
[[query.forbidden]]
match = "money:14.95"
why = "superseded January 2025 PCI non-validation fee (now $19.95)"

[[query]]
id = "V14"
query = "I sent a wire to my supplier yesterday afternoon and they're saying it never came in. Can you see where it is?"
tags = ["wires", "account-specific", "wire-trace", "cutoff", "stale-faq"]
acceptable = ["partial"]
notes = "The assistant cannot see this customer's wire status. It should say that Business Support can request a trace to locate a wire that hasn't arrived, for $35.00 per request (WIR-05). It should also explain that wires submitted or approved after the cut-off (4:00 PM ET domestic, 2:00 PM ET international) are processed the next business day; domestic wires usually arrive the same business day, international wires in 1–3 business days."
[[query.facts]]
id = "trace"
match = "text:trace"
support = [
  { doc = "wire-transfers", quote = "Business Support can also request an amendment to correct the details of a wire that has already been sent, or a trace to locate a wire that hasn't arrived." },
  { doc = "fee-schedule-2026-07", row = "WIR-05" },
]
[[query.facts]]
id = "trace_fee"
match = "money:35"
support = [
  { doc = "wire-transfers", quote = "Each recall, amendment, or trace request costs $35.00 (fee code WIR-05 in the Business Fee & Rate Schedule), charged whether or not the recall is successful." },
  { doc = "fee-schedule-2026-07", row = "WIR-05" },
]
[[query.facts]]
id = "domestic_cutoff"
match = "time:4pm"
support = [{ doc = "wire-transfers", quote = "Domestic wires: 4:00 PM ET" }]
[[query.forbidden]]
match = "time:3pm"
why = "domestic cut-off from the possibly outdated Wire Transfers FAQ; the Wire Transfer Policy says 4:00 PM ET"
[[query.forbidden]]
match = "time:1pm"
why = "international cut-off from the possibly outdated Wire Transfers FAQ; the Wire Transfer Policy says 2:00 PM ET"

[[query]]
id = "V15"
query = "batch cutoff time for next-day payout?"
tags = ["payouts", "batch-close", "shorthand", "plan-dependent"]
acceptable = ["answer"]
notes = "The daily card batch closes automatically at 8:00 PM ET, and sales after that go into the next day's batch. Next-business-day standard payouts apply on Bridge Plus and Bridge Premier; Bridge Essentials pays 2 business days after batch close. Weekend batches are treated as closing on Monday."
[[query.facts]]
id = "batch_close"
match = "time:8pm"
support = [
  { doc = "payouts-and-settlement", quote = "Card transactions are grouped into a daily batch that closes automatically at 8:00 PM ET." },
  { doc = "payouts-and-settlement", quote = "Sales made after 8:00 PM ET are included in the next day's batch." },
  { doc = "payouts-and-settlement", quote = "Batch closes (8:00 PM ET): Monday" },
  { doc = "help-getting-paid", quote = "Card transactions are grouped into a daily batch that closes automatically at 8:00 PM ET." },
  { doc = "help-getting-paid", quote = "Sales made after 8:00 PM ET are included in the next day's batch." },
  { doc = "business-checking-plans", quote = "Your plan sets how quickly standard payouts for card sales arrive after the daily batch closes at 8:00 PM ET" },
]
[[query.facts]]
id = "next_day_plans"
match = "text:Bridge Plus"
support = [
  { doc = "payouts-and-settlement", quote = "Bridge Plus: standard payouts arrive the next business day after batch close." },
  { doc = "business-checking-plans", quote = "2 business days after batch close on Bridge Essentials, and the next business day on Bridge Plus and Bridge Premier." },
  { doc = "help-getting-paid", quote = "Plan: Bridge Plus; Standard payout timing: Next business day after the batch closes" },
  { doc = "agent-handling-guidelines", quote = "Bridge Essentials payouts arrive 2 business days after batch close, and Bridge Plus and Bridge Premier payouts arrive the next business day." },
]
[[query.forbidden]]
match = "time:7pm"
why = "check-deposit and standard ACH cut-off, not the card batch close"

[[query]]
id = "V16"
query = "Someone just called saying they were from MerchantBridge and asked me to read back the code you texted me. Was that actually you?"
tags = ["security", "phishing", "one-time-passcode", "impersonation", "customer-voice"]
acceptable = ["answer"]
notes = "MerchantBridge never calls, texts or emails to ask for a one-time passcode, password, PIN or full card number, so the caller was not a legitimate MerchantBridge request. Tell the customer not to share the code, to hang up and call the 24/7 Card Fraud line at 1-800-555-0199, and to change their password, since someone may be trying to sign in. Reporting phishing to phishing@merchantbridge.example is a plus."
[[query.facts]]
id = "never_asks"
match = "text:never"
support = [
  { doc = "help-online-banking-security", quote = "MerchantBridge will never call, text, or email you to ask for your one-time passcode, password, PIN, or full card number." },
  { doc = "products-overview", quote = "MerchantBridge will never call, text or email you to ask for your PIN, full card number, password or one-time passcode." },
  { doc = "card-security-and-fraud", quote = "Scammers sometimes pretend to be MerchantBridge, but we will never ask for your PIN, full card number, password, or one-time passcode, whether by phone, text, or email." },
  { doc = "help-lost-or-stolen-card", quote = "We will never ask for your PIN, full card number, or one-time passcode." },
  { doc = "help-business-debit-card", quote = "MerchantBridge will never call, text, or email you to ask for your PIN, full card number, password, or one-time passcode." },
  { doc = "caller-verification-sop", quote = "Customers are told that MBFS will never ask for these." },
]
[[query.facts]]
id = "fraud_line"
match = "text:1-800-555-0199"
support = [
  { doc = "card-security-and-fraud", quote = "If someone asks, hang up and call the 24/7 Card Fraud line at 1-800-555-0199." },
  { doc = "help-lost-or-stolen-card", quote = "If someone contacts you claiming to be from MerchantBridge and asks for this information, hang up and call the 24/7 Card Fraud line at 1-800-555-0199." },
  { doc = "help-online-banking-security", quote = "If anyone asks for them, don't share them: end the call or ignore the message, and call the 24/7 Card Fraud line at 1-800-555-0199 or Business Support at 1-800-555-0142." },
  { doc = "products-overview", quote = "24/7 Card Fraud line: 1-800-555-0199, for a lost, stolen or compromised debit card, or any suspected fraud on your account." },
]
[[query.facts]]
id = "change_password"
match = "re:(?i)\\b(?:change|reset|update)\\w*\\s+(?:\\w+\\s+){0,2}password"
support = [
  { doc = "help-online-banking-security", quote = "If you get a verification code you didn't request, don't share it with anyone, and change your password. Someone may be trying to sign in as you." },
  { doc = "help-online-banking-security", quote = "If you entered your password or a passcode on a suspicious site, reset your password right away and call Business Support." },
]

[[query]]
id = "V17"
query = "cust's mobile depsoit got rejected for endorsement even though they signed the back, what does it need to say?"
tags = ["mobile-deposit", "endorsement", "typo", "exact-wording"]
acceptable = ["answer"]
notes = "A signature alone is not enough: the back of the check must also carry the words \"For mobile deposit only at MerchantBridge\". After correcting the endorsement, the customer can retake the photos and submit the check again."
[[query.facts]]
id = "endorsement_wording"
match = "text:For mobile deposit only at MerchantBridge"
support = [
  { doc = "funds-availability", quote = "The words \"For mobile deposit only at MerchantBridge\"." },
  { doc = "help-mobile-deposit", quote = "On the back, sign your name and write \"For mobile deposit only at MerchantBridge\"." },
  { doc = "help-mobile-deposit", quote = "The endorsement is missing or doesn't include \"For mobile deposit only at MerchantBridge\"." },
]

[[query]]
id = "V18"
query = "I just opened the account. How do I add my business partner so she can log in too, and can she get her own debit card?"
tags = ["user-management", "employee-cards", "multi-part", "customer-voice"]
acceptable = ["answer", "partial"]
notes = "An owner or admin adds her as a user in Settings in the MerchantBridge app. User changes must be approved in the app by an owner or admin, and staff can't make them over the phone. She then sets up her own password and two-step verification. For a card, owners and admins can order up to 10 employee cards with spend controls under Cards > Employee cards. The KB describes additional cards only as employee cards, so saying that it does not cover a separate co-owner card is acceptable (partial)."
[[query.facts]]
id = "add_user_settings"
match = "text:Settings"
support = [{ doc = "help-online-banking-security", quote = "An owner or admin can add users in Settings, and each new user sets up their own password and two-step verification." }]
[[query.facts]]
id = "own_sign_in"
match = "text:password"
support = [
  { doc = "help-online-banking-security", quote = "An owner or admin can add users in Settings, and each new user sets up their own password and two-step verification." },
  { doc = "help-online-banking-security", quote = "Give everyone who needs access their own sign-in." },
]
[[query.facts]]
id = "employee_card"
match = "text:employee card"
support = [
  { doc = "help-business-debit-card", quote = "Owners and admins can order up to 10 employee cards with spend controls." },
  { doc = "help-business-debit-card", quote = "To order an employee card or change its spend controls, go to Cards > Employee cards in the MerchantBridge app." },
  { doc = "products-overview", quote = "Use it for purchases and ATM withdrawals, and add up to 10 employee cards with spend controls." },
]

[[query]]
id = "V19"
query = "daily limit for new accts?"
tags = ["limits", "ambiguous", "shorthand", "plan-dependent"]
acceptable = ["clarify"]
notes = "Ask which daily limit is meant (debit card purchases or ATM withdrawals, mobile deposit, outgoing wires, or Instant Payouts) and which plan. The KB sets these limits by plan and lists no separate limits for new accounts, though a new account can get check-deposit exception holds of up to 7 business days during its first 30 days."
facts = []

