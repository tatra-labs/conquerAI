[[query]]
id = "V07"
query = "I got an email about a chargeback over the weekend, how long do I have to send you proof?"
tags = ["chargebacks", "deadlines", "weekend", "merchant-portal"]
acceptable = ["answer"]
notes = "A chargeback must be accepted or answered within 10 calendar days of the notification date, counting weekends and holidays, so the weekend days already count. Evidence goes in on the Disputes tab of the Merchant Portal, where the case shows the exact deadline; with no response by then, the chargeback is accepted automatically and the funds aren't returned."
[[query.facts]]
id = "deadline_10_calendar_days"
match = "days:10"
support = [
  { doc = "chargebacks-and-disputes", quote = "Accept or respond within 10 calendar days of notification" },
  { doc = "chargebacks-and-disputes", quote = "The 10 calendar days are counted from the notification date, including weekends and holidays." },
]
[[query.facts]]
id = "weekends_count"
match = "re:(?i)\\b(weekends?|saturdays?|sundays?)\\b"
support = [
  { doc = "chargebacks-and-disputes", quote = "The 10 calendar days are counted from the notification date, including weekends and holidays." },
]
[[query.facts]]
id = "respond_in_merchant_portal"
match = "re:(?i)disputes tab|merchant portal"
support = [
  { doc = "chargebacks-and-disputes", quote = "Sign in to the Merchant Portal and open the Disputes tab." },
  { doc = "chargebacks-and-disputes", quote = "Notify you by email and in the Merchant Portal, on the Disputes tab." },
  { doc = "chargebacks-and-disputes", quote = "Upload your documents and add a short explanation of what happened." },
  { doc = "chargebacks-and-disputes", quote = "This policy explains what happens when a cardholder disputes a payment made to your business, the deadlines that apply at each stage, and how to respond in the Merchant Portal." },
  { doc = "products-overview", quote = "Manage refunds and disputes in the Merchant Portal (portal.merchantbridge.example)" },
]
[[query.forbidden]]
match = "re:(?i)\\b(10|ten) business days\\b"
why = "the deadline is 10 calendar days counted from notification, including weekends and holidays, not business days"
[[query.forbidden]]
match = "days:60"
why = "60 days is the window for disputing an unauthorized transaction on your own debit card, not for responding to a chargeback"
[[query.forbidden]]
match = "money:15"
why = "superseded January 2025 chargeback fee; the current fee is $25.00"

[[query]]
id = "V08"
query = "cust gave her one-time code to a caller saying he was from MBFS, next steps?"
tags = ["fraud", "phishing", "account-takeover", "security"]
acceptable = ["answer"]
notes = "MBFS never asks for one-time passcodes, so treat this as suspected account takeover: transfer her to the Fraud team (24/7 Card Fraud line 1-800-555-0199) and have her lock her card and reset her password right away. She should also review recent transactions, and the agent must never ask her to read out the code."
[[query.facts]]
id = "fraud_team"
match = "re:(?i)fraud (team|line|department)|1-800-555-0199"
support = [
  { doc = "caller-verification-sop", quote = "If you suspect account takeover, transfer the caller to the Fraud team." },
  { doc = "agent-handling-guidelines", quote = "Team: Fraud team; Escalate for: Failed caller verification and suspected account takeover" },
  { doc = "card-security-and-fraud", quote = "If someone asks, hang up and call the 24/7 Card Fraud line at 1-800-555-0199." },
  { doc = "card-security-and-fraud", quote = "If you have already shared these details, lock your card and call us right away." },
  { doc = "help-online-banking-security", quote = "If anyone asks for them, don't share them: end the call or ignore the message, and call the 24/7 Card Fraud line at 1-800-555-0199 or Business Support at 1-800-555-0142." },
  { doc = "help-lost-or-stolen-card", quote = "If someone contacts you claiming to be from MerchantBridge and asks for this information, hang up and call the 24/7 Card Fraud line at 1-800-555-0199." },
  { doc = "products-overview", quote = "24/7 Card Fraud line: 1-800-555-0199, for a lost, stolen or compromised debit card, or any suspected fraud on your account." },
]
[[query.facts]]
id = "reset_password"
match = "re:(?i)\\b(reset|chang)\\w*\\s+(\\w+\\s+){0,3}password|password\\s+(reset|change)"
support = [
  { doc = "help-online-banking-security", quote = "If you entered your password or a passcode on a suspicious site, reset your password right away and call Business Support." },
  { doc = "help-online-banking-security", quote = "If you get a verification code you didn't request, don't share it with anyone, and change your password." },
]
[[query.facts]]
id = "lock_card"
match = "text:lock"
support = [
  { doc = "card-security-and-fraud", quote = "If you have already shared these details, lock your card and call us right away." },
  { doc = "help-online-banking-security", quote = "If you shared card details, lock your card in the app (Cards > Lock card) and call the 24/7 Card Fraud line at 1-800-555-0199." },
]

