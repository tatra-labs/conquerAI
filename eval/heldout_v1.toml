# MBFS held-out set, H01-H12. Same schema as dev.toml.
#
# Built in isolation, before the system had ever been run on these queries: one agent wrote the questions
# scenario-first from the brief's requirements (customer and agent voice, a typo, multi-part, ambiguous,
# out-of-scope and account-specific asks); a second agent labeled them blind against a plain-text dump of
# the indexed corpus, with no access to the code or to any system output. Labels are as returned; the
# labeler's own doubts are in eval/heldout_notes.md. results.json records this file's SHA-256 ("frozen").

[[query]]
id = "H01"
query = "I did $2,214 in sales yesterday but my payout was only $1,912, where did the rest go?"
tags = ["payouts", "deductions", "account-specific", "reasoning", "customer-phrasing"]
acceptable = ["partial", "answer"]
notes = "The exact split of the $302 needs the merchant's own payout and transaction detail (verify the caller first), but the KB explains what reduces a payout: per-transaction processing fees, refunds, chargebacks (disputed amount plus the $25.00 fee), a rolling reserve of up to 10% of daily card volume (holds/reserves go to Risk Operations without speculating) or backup withholding after a TIN-mismatch notice. A strong answer also notes that sales after the 8:00 PM ET batch close roll into the next batch and that plan timing (2 business days on Essentials, next business day on Plus/Premier) means the payout may not be yesterday's batch, without asserting which cause applies."
[[query.facts]]
id = "processing_fees"
match = "text:processing fee"
support = [
  { doc = "help-tax-forms", quote = "Your 1099-K shows the gross amount of your card payments for the year, before refunds, chargebacks, and processing fees are subtracted, so it may not match the payouts deposited to your account." },
  { doc = "fee-schedule-2026-07", row = "MER-01" },
  { doc = "fee-schedule-2026-07", row = "MER-02" },
]
[[query.facts]]
id = "refunds_deducted"
match = "text:refund"
support = [
  { doc = "payouts-and-settlement", quote = "Refunds you issue are deducted from your next payout." },
  { doc = "help-getting-paid", quote = "Refunds you issue are deducted from your next payout or your checking balance." },
  { doc = "help-refunds", quote = "Refunds are deducted from your next payout. If your next payout isn't enough to cover a refund, the remaining amount is deducted from your MerchantBridge business checking balance." },
  { doc = "help-refunds", quote = "Refunds are deducted from your next payout first." },
  { doc = "help-tax-forms", quote = "Your 1099-K shows the gross amount of your card payments for the year, before refunds, chargebacks, and processing fees are subtracted, so it may not match the payouts deposited to your account." },
]
[[query.facts]]
id = "chargebacks_deducted"
match = "text:chargeback"
support = [
  { doc = "payouts-and-settlement", quote = "When MBFS receives a chargeback, the disputed amount plus the chargeback fee is also deducted from your next payout." },
  { doc = "chargebacks-and-disputes", quote = "Debit the disputed amount plus the chargeback fee from your next payout." },
  { doc = "help-getting-paid", quote = "When we receive a chargeback, we debit the disputed amount plus the chargeback fee from your next payout, or from your checking account if your payouts aren't enough to cover it." },
  { doc = "help-tax-forms", quote = "Your 1099-K shows the gross amount of your card payments for the year, before refunds, chargebacks, and processing fees are subtracted, so it may not match the payouts deposited to your account." },
]
[[query.forbidden]]
match = "money:15"
why = "Stale chargeback fee from the superseded January 2025 schedule (MER-05 was $15.00); the current fee is $25.00."

[[query]]
id = "H02"
query = "out-of-network ATM fee on Essentials?"
tags = ["fees", "debit-card", "atm", "plan-specific", "stale-value-trap", "terse-shorthand"]
acceptable = ["answer"]
notes = "Bridge Essentials charges $2.50 per out-of-network ATM withdrawal (NON-NETWORK ATM FEE), plus any surcharge the ATM operator charges; Allpoint network ATMs are in-network and surcharge-free. The rebate of up to 4 out-of-network ATM fees per statement cycle is Premier-only and must not be attributed to Essentials."
[[query.facts]]
id = "atm_fee"
match = "money:2.50"
support = [
  { doc = "fee-schedule-2026-07", row = "CRD-02", column = "Bridge Essentials" },
  { doc = "help-business-debit-card", quote = "Withdrawals at ATMs outside the Allpoint network have a $2.50 out-of-network ATM fee, plus any surcharge the ATM operator charges." },
  { doc = "help-business-debit-card", quote = "Out-of-network ATM fee (per withdrawal); Bridge Essentials: $2.50" },
]
[[query.forbidden]]
match = "money:2"
why = "Stale out-of-network ATM fee from the superseded January 2025 schedule (CRD-02 was $2.00)."

[[query]]
id = "H03"
query = "I got a text saying it's from MerchantBridge asking for the verification code you just sent me, is that legit?"
tags = ["security", "phishing", "one-time-passcode", "account-takeover", "customer-phrasing"]
acceptable = ["answer"]
notes = "Not legitimate: MerchantBridge never calls, texts or emails to ask for a one-time passcode, so the code must not be shared; an unrequested code means someone may be trying to sign in, so the customer should change the password, report the text to phishing@merchantbridge.example and call the 24/7 Card Fraud line (1-800-555-0199) or Business Support (1-800-555-0142). If the code was already shared, the password should be reset right away, and the agent must not ask the caller to read the code out."
[[query.facts]]
id = "never_asks"
match = "text:never"
support = [
  { doc = "help-online-banking-security", quote = "MerchantBridge will never call, text, or email you to ask for your one-time passcode, password, PIN, or full card number." },
  { doc = "products-overview", quote = "MerchantBridge will never call, text or email you to ask for your PIN, full card number, password or one-time passcode." },
  { doc = "card-security-and-fraud", quote = "Scammers sometimes pretend to be MerchantBridge, but we will never ask for your PIN, full card number, password, or one-time passcode, whether by phone, text, or email." },
  { doc = "help-lost-or-stolen-card", quote = "We will never ask for your PIN, full card number, or one-time passcode." },
  { doc = "help-business-debit-card", quote = "MerchantBridge will never call, text, or email you to ask for your PIN, full card number, password, or one-time passcode." },
  { doc = "caller-verification-sop", quote = "Customers are told that MBFS will never ask for these." },
]
[[query.facts]]
id = "change_password"
match = "re:(?i)(chang(e|ing)|reset(ting)?|updat(e|ing))\\s+(your\\s+|the\\s+|their\\s+|her\\s+|his\\s+|account\\s+)?password|password\\s+(reset|change)|new\\s+password"
support = [
  { doc = "help-online-banking-security", quote = "If you get a verification code you didn't request, don't share it with anyone, and change your password. Someone may be trying to sign in as you." },
  { doc = "help-online-banking-security", quote = "If you entered your password or a passcode on a suspicious site, reset your password right away and call Business Support." },
]
[[query.facts]]
id = "report_phishing"
match = "text:phishing@merchantbridge.example"
support = [
  { doc = "help-online-banking-security", quote = "Report phishing emails and texts to phishing@merchantbridge.example, then delete them." },
  { doc = "products-overview", quote = "Phishing: report phishing to phishing@merchantbridge.example." },
  { doc = "card-security-and-fraud", quote = "Forward suspicious emails to phishing@merchantbridge.example." },
  { doc = "help-lost-or-stolen-card", quote = "You can forward suspicious emails to phishing@merchantbridge.example." },
]

[[query]]
id = "H04"
query = "cust wants to send her terminal back, how does that work?"
tags = ["terminals", "returns", "rented-vs-purchased", "ambiguity", "agent-shorthand"]
acceptable = ["answer", "clarify", "partial"]
notes = "Only rented terminals are returned: within 30 days of cancelling the rental or closing the account, using the prepaid return label (pack it, attach the label, drop it with the carrier, keep the tracking number), otherwise a non-return fee of $199.00 (Mini) or $599.00 (Pro) applies; a purchased terminal is hers to keep. Asking whether it is rented or purchased (or defective: rented units are replaced free, purchased units have a 1-year warranty) is fine; the KB does not say how to cancel a rental or whether a purchased terminal can be refunded, so those points should be escalated (Merchant Operations owns terminals), not promised."
[[query.facts]]
id = "return_window"
match = "days:30"
support = [
  { doc = "help-terminals", quote = "If you cancel a terminal rental or close your MerchantBridge account, return each rented terminal within 30 days of the cancellation or account closure, using the prepaid return label we provide." },
  { doc = "help-terminals", quote = "Non-return fee: If a rented terminal is not returned within 30 days of cancellation or account closure, a non-return fee is charged for each terminal: $199.00 for a BridgeTerminal Mini or $599.00 for a BridgeTerminal Pro." },
  { doc = "account-closure", quote = "Return within 30 days of closure using the prepaid return label, or a $199.00 non-return fee applies" },
  { doc = "account-closure", quote = "Return within 30 days of closure using the prepaid return label, or a $599.00 non-return fee applies" },
  { doc = "account-closure", quote = "The same 30-day window applies if you cancel a terminal rental but keep your account open." },
  { doc = "fee-schedule-2026-07", row = "HW-05" },
  { doc = "fee-schedule-2026-07", row = "HW-06" },
]
[[query.facts]]
id = "prepaid_label"
match = "text:prepaid"
support = [
  { doc = "help-terminals", quote = "If you cancel a terminal rental or close your MerchantBridge account, return each rented terminal within 30 days of the cancellation or account closure, using the prepaid return label we provide." },
  { doc = "help-terminals", quote = "Attach the prepaid return label and drop the package off with the carrier shown on the label." },
  { doc = "account-closure", quote = "Return within 30 days of closure using the prepaid return label, or a $199.00 non-return fee applies" },
  { doc = "account-closure", quote = "Return within 30 days of closure using the prepaid return label, or a $599.00 non-return fee applies" },
]
[[query.facts]]
id = "purchased_kept"
match = "re:(?i)\\b(bought|purchased?)\\b"
support = [
  { doc = "help-terminals", quote = "Only rented terminals need to be returned. A terminal you bought is yours to keep, even if you close your account." },
  { doc = "account-closure", quote = "If you bought it: No return needed" },
  { doc = "account-closure", quote = "Note: Purchased terminals are yours to keep, but they cannot accept card payments through MerchantBridge after your account is closed." },
]

[[query]]
id = "H05"
query = "Do I need to sign the back of the check if I'm depositing it in the app?"
tags = ["mobile-deposit", "endorsement", "policy-vs-help-conflict", "customer-phrasing"]
acceptable = ["answer"]
notes = "Yes: before photographing the check, endorse the back with the signature and the words \"For mobile deposit only at MerchantBridge\"; a check without this endorsement may be rejected. If the answer mentions keeping the paper check, the Funds Availability Policy's 14 days (then destroy it) wins over the help article's 30 days."
[[query.facts]]
id = "signature"
match = "re:(?i)\\byes\\b|signature|sign\\s+(your\\s+name|the\\s+back|it)"
support = [
  { doc = "funds-availability", quote = "Before you photograph the check, endorse the back with:" },
  { doc = "funds-availability", quote = "Your signature." },
  { doc = "help-mobile-deposit", quote = "On the back, sign your name and write \"For mobile deposit only at MerchantBridge\"." },
]
[[query.facts]]
id = "endorsement_words"
match = "text:For mobile deposit only at MerchantBridge"
support = [
  { doc = "funds-availability", quote = "The words \"For mobile deposit only at MerchantBridge\"." },
  { doc = "help-mobile-deposit", quote = "On the back, sign your name and write \"For mobile deposit only at MerchantBridge\"." },
  { doc = "help-mobile-deposit", quote = "The endorsement is missing or doesn't include \"For mobile deposit only at MerchantBridge\"." },
]
[[query.forbidden]]
match = "days:30"
why = "The help article's 30-day check-retention period conflicts with the more authoritative Funds Availability Policy, which says to keep the check 14 days and then destroy it."

[[query]]
id = "H06"
query = "chargeback response deadline? merchant just got the notice"
tags = ["chargebacks", "deadlines", "calendar-days", "agent-shorthand", "stale-value-trap"]
acceptable = ["answer"]
notes = "The merchant must accept or respond with evidence in the Merchant Portal's Disputes tab within 10 calendar days of the notification date, weekends and holidays included; otherwise the chargeback is automatically accepted and the disputed funds are not returned. A good answer may add the 7-calendar-day retrieval-request deadline, that the $25.00 chargeback fee is non-refundable even if the merchant wins, and that the merchant should not also refund a sale that has already been charged back."
[[query.facts]]
id = "ten_days"
match = "days:10"
support = [
  { doc = "chargebacks-and-disputes", quote = "Accept or respond within 10 calendar days of notification" },
  { doc = "chargebacks-and-disputes", quote = "The 10 calendar days are counted from the notification date, including weekends and holidays." },
]
[[query.facts]]
id = "calendar_days"
match = "re:(?i)calendar|including\\s+weekends|weekends\\s+and\\s+holidays"
support = [
  { doc = "chargebacks-and-disputes", quote = "Accept or respond within 10 calendar days of notification" },
  { doc = "chargebacks-and-disputes", quote = "The 10 calendar days are counted from the notification date, including weekends and holidays." },
]
[[query.facts]]
id = "auto_accepted"
match = "re:(?i)automatically\\s+accept|accepted\\s+automatically|auto-?accept|deemed\\s+accepted|by\\s+default"
support = [
  { doc = "chargebacks-and-disputes", quote = "If you don't accept or respond by the deadline, the chargeback is automatically accepted and the disputed funds are not returned." },
]
[[query.forbidden]]
match = "text:10 business days"
why = "The chargeback window is 10 calendar days including weekends and holidays; 10 business days is the debit-card provisional-credit timing."
[[query.forbidden]]
match = "money:15"
why = "Stale chargeback fee from the superseded January 2025 schedule (MER-05 was $15.00); the current fee is $25.00."

