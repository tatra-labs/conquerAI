match = "re:(?i)\\b(6|six)\\b"
support = [
  { doc = "business-savings", quote = "You can make 6 withdrawals from Bridge Reserve Savings per statement cycle at no charge." },
  { doc = "fee-schedule-2026-07", row = "SAV-02" },
]
[[query.facts]]
id = "excess_fee"
match = "money:10"
support = [
  { doc = "business-savings", quote = "Each withdrawal beyond 6 in the same statement cycle is charged $10.00 (EXCESS WITHDRAWAL FEE on your statement)." },
  { doc = "fee-schedule-2026-07", row = "SAV-02" },
