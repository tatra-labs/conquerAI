[[query]]
id = "H09"
query = "How much do you guys charge to send money to my supplier?"
tags = ["fees", "ach", "wires", "ambiguity", "plan-unspecified", "outdated-faq-trap", "stale-value-trap"]
acceptable = ["answer", "clarify"]
notes = "The cost depends on method and plan, so the assistant should either ask (ACH or wire, domestic or international, which plan) or list the current options: standard ACH $0.25 per payment on Essentials (Plus: first 100 per cycle included, then $0.15; Premier included), same-day ACH $5.00 per batch ($2.00 on Premier), outgoing domestic wire $30/$25/included, outgoing international wire $50/$45/$25 plus possible intermediary-bank deductions. Essentials' international wire is $50, not the outdated FAQ's $45, and the FAQ's 3:00/1:00 PM cut-offs are superseded by 4:00/2:00 PM ET."
[[query.facts]]
id = "standard_ach_essentials"
match = "money:0.25"
support = [
  { doc = "fee-schedule-2026-07", row = "ACH-01", column = "Bridge Essentials" },
]
[[query.facts]]
id = "domestic_wire_essentials"
match = "money:30"
support = [
  { doc = "fee-schedule-2026-07", row = "WIR-01", column = "Bridge Essentials" },
]
[[query.facts]]
id = "intl_wire_essentials"
match = "money:50"
support = [
  { doc = "fee-schedule-2026-07", row = "WIR-03", column = "Bridge Essentials" },
]
[[query.forbidden]]
match = "money:40"
why = "Stale Bridge Plus outgoing international wire fee from the possibly outdated Wire Transfers FAQ and the superseded 2025 schedule; current WIR-03 for Plus is $45.00."
[[query.forbidden]]
match = "time:3pm"
why = "Outdated FAQ domestic wire cut-off; the Wire Transfer Policy cut-off is 4:00 PM ET."
[[query.forbidden]]
match = "time:1pm"
why = "Outdated FAQ international wire cut-off; the Wire Transfer Policy cut-off is 2:00 PM ET."

[[query]]
id = "H10"
query = "why was this cust's application declined?"
tags = ["onboarding", "kyc", "account-specific", "escalation", "agent-shorthand"]
acceptable = ["refuse", "partial"]
notes = "The decline reason for a specific application is account data that is not in the KB, so the assistant must not guess; it should route the agent to the Onboarding team, which handles application status. It may add general context (prohibited types such as cannabis, crypto exchanges/ATMs, money services businesses, online gambling and adult entertainment; US registration and a US physical address, no P.O. boxes; restricted types needing enhanced review) without presenting any of it as this customer's reason or promising approval."
[[query.facts]]
id = "route_onboarding"
match = "text:Onboarding"
support = [
  { doc = "account-opening-kyc", quote = "Our Onboarding team handles questions about an application in progress." },
  { doc = "agent-handling-guidelines", quote = "Team: Onboarding; Escalate for: Restricted business types and application status" },
  { doc = "account-opening-kyc", quote = "MerchantBridge support agents must not promise approval for a restricted business type and must route the applicant to the Onboarding team, which carries out the enhanced review and makes the decision." },
  { doc = "agent-handling-guidelines", quote = "They may be approved only after enhanced due diligence, so route the applicant to Onboarding." },
]

[[query]]
id = "H11"
query = "How do I add my business partner to the account, and can she get her own debit card?"
tags = ["users", "permissions", "employee-cards", "multi-part", "in-app-approval", "customer-phrasing"]
acceptable = ["answer", "partial"]
notes = "An owner or admin adds her as a user in Settings (she sets up her own password and two-step verification); user changes must be approved in the MBFS app by an owner or admin, so an agent cannot add her over the phone. She can get her own Bridge Business Debit Mastercard as one of up to 10 employee cards with spend controls (Cards > Employee cards); if she is a co-owner the business should also update its ownership information, and the KB does not describe role assignment or a separate owner card."
[[query.facts]]
id = "add_in_settings"
match = "text:Settings"
support = [
  { doc = "help-online-banking-security", quote = "An owner or admin can add users in Settings, and each new user sets up their own password and two-step verification." },
]
[[query.facts]]
id = "owner_or_admin"
match = "re:(?i)owners?\\s*(or|and|/)\\s*(an\\s+)?admins?"
support = [
  { doc = "help-online-banking-security", quote = "An owner or admin can add users in Settings, and each new user sets up their own password and two-step verification." },
  { doc = "help-online-banking-security", quote = "For your protection, changes to users, your payout bank account, or your contact email or phone number must be approved in the MerchantBridge app by an owner or admin." },
  { doc = "caller-verification-sop", quote = "An owner or admin can add them as a user in the app; after that, verify them like any other user." },
  { doc = "caller-verification-sop", quote = "Role: Owner or admin; What you can discuss or do for them: Full access to the account, including adding users and changing the payout destination" },
  { doc = "caller-verification-sop", quote = "These changes always require approval in the app by an owner or admin, even when the caller is verified:" },
]
[[query.facts]]
id = "employee_card"
match = "text:employee card"
support = [
  { doc = "help-business-debit-card", quote = "Owners and admins can order up to 10 employee cards with spend controls." },
