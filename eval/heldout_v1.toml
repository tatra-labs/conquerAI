[[query]]
id = "H12"
query = "PCI SAQ still required if merchant only uses the Mini?"
tags = ["pci", "saq", "p2pe", "terminals", "agent-shorthand", "stale-value-trap"]
acceptable = ["answer", "partial"]
notes = "Yes: every merchant must complete the annual SAQ in BridgeSecure whatever its setup; accepting cards only through MerchantBridge P2PE terminals may qualify it for the shorter SAQ P2PE (not if it also takes online or invoice payments), and since the KB never states the Mini's P2PE status, that point must be hedged. Not completing the SAQ within 60 days of its due date triggers the $19.95/month non-validation fee on every plan."
[[query.facts]]
id = "still_required"
match = "re:(?i)\\b(yes|required|must)\\b"
support = [
  { doc = "pci-compliance", quote = "All MerchantBridge merchants must:" },
  { doc = "pci-compliance", quote = "Complete the annual PCI Self-Assessment Questionnaire (SAQ) in BridgeSecure by its due date." },
  { doc = "pci-compliance", quote = "As a MerchantBridge merchant, you are responsible for meeting PCI DSS and for confirming your compliance each year in BridgeSecure, our PCI compliance portal." },
  { doc = "pci-compliance", quote = "The SAQ is due again every year, so plan to complete it annually." },
  { doc = "products-overview", quote = "complete your annual PCI Self-Assessment Questionnaire in BridgeSecure." },
]
[[query.facts]]
id = "saq_p2pe"
match = "re:(?i)P2PE|point-to-point"
support = [
  { doc = "pci-compliance", quote = "If you accept cards only through MerchantBridge terminals that use point-to-point encryption, you may qualify for SAQ P2PE, a shorter questionnaire." },
]
[[query.forbidden]]
match = "money:14.95"
why = "Stale PCI non-validation fee from the superseded January 2025 schedule; current MER-07 is $19.95 per month on every plan."
